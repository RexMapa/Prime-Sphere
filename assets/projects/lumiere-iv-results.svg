<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1164" width="1200" height="1164" font-family="Sora, 'Segoe UI', Arial, sans-serif">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22E3A0"/><stop offset="1" stop-color="#1E90FF"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="0%" r="70%"><stop offset="0" stop-color="#D4AF6A" stop-opacity=".28"/><stop offset="1" stop-color="#D4AF6A" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="1164" fill="#050B18"/><rect width="1200" height="1164" fill="url(#glow)"/>
<text x="80" y="100" font-size="15" letter-spacing="4" fill="#D4AF6A">CASE STUDY</text><text x="80" y="160" font-size="44" font-weight="800" fill="#EEF3FB">Lumière IV: Scaling Beyond the Dashboard</text><rect x="80" y="210" width="330" height="120" rx="14" fill="#0B1730" stroke="#ffffff" stroke-opacity=".09"/>
<text x="104" y="270" font-size="38" font-weight="800" fill="#EEF3FB">A$1,820</text>
<text x="104" y="302" font-size="16" fill="#8A99B2">Ad spend</text><rect x="435" y="210" width="330" height="120" rx="14" fill="#0B1730" stroke="#ffffff" stroke-opacity=".09"/>
<text x="459" y="270" font-size="38" font-weight="800" fill="#EEF3FB">A$19,991</text>
<text x="459" y="302" font-size="16" fill="#8A99B2">Front-end revenue</text><rect x="790" y="210" width="330" height="120" rx="14" fill="#0B1730" stroke="#ffffff" stroke-opacity=".09"/>
<text x="814" y="270" font-size="38" font-weight="800" fill="#EEF3FB">A$18,171</text>
<text x="814" y="302" font-size="16" fill="#8A99B2">Gross marketing profit</text><rect x="80" y="386" width="48" height="4" rx="2" fill="#D4AF6A"/><text x="80" y="424" font-size="26" font-weight="700" fill="#EEF3FB">The Bottleneck</text><text x="80" y="468" font-size="21" fill="#B6C2D6" font-weight="400">Many aesthetic clinics focus strictly on cost per lead, which can hide actual</text>
<text x="80" y="501" font-size="21" fill="#B6C2D6" font-weight="400">profitability. Lumière IV needed clear visibility into the direct revenue</text>
<text x="80" y="533" font-size="21" fill="#B6C2D6" font-weight="400">generated by their advertising, including the cost of management fees, in a highly</text>
<text x="80" y="566" font-size="21" fill="#B6C2D6" font-weight="400">competitive market.</text><rect x="80" y="614" width="48" height="4" rx="2" fill="#D4AF6A"/><text x="80" y="652" font-size="26" font-weight="700" fill="#EEF3FB">The Strategy</text><text x="80" y="696" font-size="21" fill="#B6C2D6" font-weight="400">Shifted from standard lead tracking to a revenue-first model. The Google Ads</text>
<text x="80" y="729" font-size="21" fill="#B6C2D6" font-weight="400">campaign was tied directly to confirmed client bookings and base service prices.</text>
<text x="80" y="761" font-size="21" fill="#B6C2D6" font-weight="400">Marketing cost combined ad spend with a proportional share of the management</text>
<text x="80" y="794" font-size="21" fill="#B6C2D6" font-weight="400">retainer, so the campaign was optimized for profit rather than clicks.</text><rect x="80" y="842" width="48" height="4" rx="2" fill="#D4AF6A"/><text x="80" y="880" font-size="26" font-weight="700" fill="#EEF3FB">The Bottom Line</text><text x="80" y="924" font-size="21" fill="#B6C2D6" font-weight="400">Over 4.5 months the campaign acquired 56 new paying clients. A$1,820 in ad spend</text>
<text x="80" y="957" font-size="21" fill="#B6C2D6" font-weight="400">generated A$19,991 in front-end revenue for a 10.9x ROAS and A$18,171 gross</text>
<text x="80" y="989" font-size="21" fill="#B6C2D6" font-weight="400">marketing profit. Including the retainer fee, true marketing ROI held at 8.2x:</text>
<text x="80" y="1022" font-size="21" fill="#B6C2D6" font-weight="400">every $1 invested returned $8.20 in confirmed bookings.</text><text x="80" y="1104" font-size="15" fill="#8A99B2">A conservative baseline: excludes mobile travel fees and lifetime value of repeat clients.</text>
</svg>