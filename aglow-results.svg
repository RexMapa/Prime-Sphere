<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1131" width="1200" height="1131" font-family="Sora, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22E3A0"/><stop offset="1" stop-color="#1E90FF"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="0%" r="70%"><stop offset="0" stop-color="#E08A4A" stop-opacity=".28"/><stop offset="1" stop-color="#E08A4A" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="1131" fill="#050B18"/><rect width="1200" height="1131" fill="url(#glow)"/>
<text x="80" y="100" font-size="15" letter-spacing="4" fill="#E08A4A">CASE STUDY</text><text x="80" y="160" font-size="44" font-weight="800" fill="#EEF3FB">Aglow Aesthetics: Engineering Intent</text><rect x="80" y="210" width="330" height="120" rx="14" fill="#0B1730" stroke="#ffffff" stroke-opacity=".09"/>
<text x="104" y="270" font-size="38" font-weight="800" fill="#EEF3FB">1,389</text>
<text x="104" y="302" font-size="16" fill="#8A99B2">Qualified clicks</text><rect x="435" y="210" width="330" height="120" rx="14" fill="#0B1730" stroke="#ffffff" stroke-opacity=".09"/>
<text x="459" y="270" font-size="38" font-weight="800" fill="#EEF3FB">7.69%</text>
<text x="459" y="302" font-size="16" fill="#8A99B2">Search CTR</text><rect x="790" y="210" width="330" height="120" rx="14" fill="#0B1730" stroke="#ffffff" stroke-opacity=".09"/>
<text x="814" y="270" font-size="38" font-weight="800" fill="#EEF3FB">A$1.19</text>
<text x="814" y="302" font-size="16" fill="#8A99B2">Average CPC</text><rect x="80" y="386" width="48" height="4" rx="2" fill="#E08A4A"/><text x="80" y="424" font-size="26" font-weight="700" fill="#EEF3FB">The Bottleneck</text><text x="80" y="468" font-size="21" fill="#B6C2D6" font-weight="400">Aglow Aesthetics needed a steady pipeline of local leads in the competitive Perth</text>
<text x="80" y="501" font-size="21" fill="#B6C2D6" font-weight="400">market. Technical constraints blocked access to the website backend, so reliable</text>
<text x="80" y="533" font-size="21" fill="#B6C2D6" font-weight="400">conversion tracking was not possible. Automated conversion bidding on bad data</text>
<text x="80" y="566" font-size="21" fill="#B6C2D6" font-weight="400">would have drained the lean testing budget on unqualified traffic.</text><rect x="80" y="614" width="48" height="4" rx="2" fill="#E08A4A"/><text x="80" y="652" font-size="26" font-weight="700" fill="#EEF3FB">The Strategy</text><text x="80" y="696" font-size="21" fill="#B6C2D6" font-weight="400">Rejected algorithmic dependency and engineered traffic intent manually: a highly</text>
<text x="80" y="729" font-size="21" fill="#B6C2D6" font-weight="400">segmented Search structure on high-intent keywords, direct response copywriting</text>
<text x="80" y="761" font-size="21" fill="#B6C2D6" font-weight="400">and aggressive negative keyword lists that act as a strict filter, so only</text>
<text x="80" y="794" font-size="21" fill="#B6C2D6" font-weight="400">motivated prospects reached the landing page.</text><rect x="80" y="842" width="48" height="4" rx="2" fill="#E08A4A"/><text x="80" y="880" font-size="26" font-weight="700" fill="#EEF3FB">The Bottom Line</text><text x="80" y="924" font-size="21" fill="#B6C2D6" font-weight="400">On a restrictive A$20 daily budget the campaign drove 1,389 qualified clicks at an</text>
<text x="80" y="957" font-size="21" fill="#B6C2D6" font-weight="400">A$1.19 average CPC with a sustained 7.69% CTR, capturing bottom-of-the-funnel</text>
<text x="80" y="989" font-size="21" fill="#B6C2D6" font-weight="400">traffic despite severe technical limitations.</text><text x="80" y="1071" font-size="15" fill="#8A99B2">Search campaign, Perth. Figures from Google Ads.</text>
</svg>